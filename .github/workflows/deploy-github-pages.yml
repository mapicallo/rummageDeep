# Builds the PWA and publishes to branch `gh-pages` for GitHub Project Pages
# (https://mapicallo.github.io/rummageDeep/).
#
# After the first run: Repository Settings → Pages → Build and deployment →
# Source: Deploy from a branch → Branch: gh-pages / /(root).

name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build core and PWA
        env:
          VITE_BASE: /rummageDeep/
        run: npm run build -w @rummagedeep/core && npm run build -w @rummagedeep/pwa

      - name: Include privacy policy in site root
        run: cp privacy.html apps/pwa/dist/privacy.html

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/pwa/dist
